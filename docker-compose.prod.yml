# Production-oriented overrides. Secrets must be supplied via environment / secrets manager.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
name: agent-banking

services:
  postgres:
    # Prefer not publishing Postgres on the host in production; bind to localhost only if needed.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    restart: always

  ai:
    environment:
      AI_ENVIRONMENT: production
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-none}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
    restart: always

  backend:
    environment:
      DEMO_SEED_ON_STARTUP: "false"
      SCHEDULING_ENABLED: "true"
      # Production must not rely on compose-file defaults for secrets — set in .env / orchestrator.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      DEMO_DEFAULT_PASSWORD: ${DEMO_DEFAULT_PASSWORD:?DEMO_DEFAULT_PASSWORD is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    restart: always

  web:
    restart: always
