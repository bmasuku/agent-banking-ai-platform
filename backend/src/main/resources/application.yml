server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: agent-banking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_banking}
    username: ${DB_USERNAME:agent_banking}
    password: ${DB_PASSWORD:agent_banking}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true

app:
  timezone: ${APP_TIMEZONE:Africa/Harare}
  currency: USD
  security:
    jwt:
      # Base64-encoded HMAC-SHA256 key (>= 256 bits). Override JWT_SECRET in every non-local environment.
      secret: ${JWT_SECRET:c2ltdWxhdGVkLWFnZW50LWJhbmtpbmctcGxhdGZvcm0tbG9jYWwtZGV2ZWxvcG1lbnQta2V5LWNoYW5nZS1tZQ==}
      issuer: agent-banking-platform
      access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
    max-failed-logins: 5
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8088,http://127.0.0.1:5173,http://127.0.0.1:8088,http://localhost:3000,http://localhost:8081,http://localhost:8082,http://localhost:19006,http://localhost:8080}
  ai:
    enabled: ${AI_SERVICE_ENABLED:true}
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    api-key: ${AI_SERVICE_API_KEY:local-dev-internal-key-change-me}
    connect-timeout: PT2S
    read-timeout: PT5S
    assistant-read-timeout: PT45S
    retry-after-failure: PT30S
  demo:
    seed-on-startup: ${DEMO_SEED_ON_STARTUP:true}
    default-password: ${DEMO_DEFAULT_PASSWORD:Demo@2026!}
    history-days: ${DEMO_HISTORY_DAYS:14}
    random-seed: 20261125
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@agentbanking.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Demo@2026!}
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
    penalty-accrual-cron: "0 30 0 * * *"
